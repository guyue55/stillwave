# ==========================================================================
# 静澜 Stillwave · 曲库自动刷新（每周定时 + 手动触发）
# 说明：本文件位于仓库根 .github/workflows/（站点文件亦在仓库根，架构 §3 文件清单）。
#   - 相对路径全部以仓库根为基准：tools/refresh-sources.py、data/audio-sources.*；
#   - 若你的布局是「仓库根 / meditation/ 子目录」，请把 working-directory 改为 meditation
#     并把下方 data/ 路径补上前缀；
#   - 未部署本 workflow 的 fork 依然 100% 可用（L1 内置 30 首 + L0 合成层兜底）。
# 安全：脚本内置整批异常保护，源站/网络整体异常时 --apply 会跳过回写并退出 3，
#       本 workflow 用 continue-on-error 承接，随后 diff 为空即不提交，绝不写废曲库。
# ==========================================================================
name: 刷新音源清单

on:
  schedule:
    # 每周一 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: stillwave-refresh-sources
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 校验内置清单（离线，零联网）
        run: |
          python3 tools/refresh-sources.py --offline --dry-run \
            --json-report /tmp/stillwave-report.json

      - name: 健康检查与动态发现并回写
        run: |
          python3 tools/refresh-sources.py --check-only --discover --max-new 10 --apply \
            --json-report /tmp/stillwave-health.json
        # 网络全失败时脚本退出码 3，但保留原文件；此处不阻断后续提交判断
        continue-on-error: true

      - name: 检查 data/ 是否有变更
        id: diff
        run: |
          if git diff --quiet -- data/audio-sources.json data/audio-sources.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交更新后的清单
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audio-sources.json data/audio-sources.js
          git commit -m "chore: 自动刷新音源清单 [skip ci]"
          git push
        env:
          # 平台自带运维期凭据，仅用于 CI 提交；不在前端代码中，不参与运行时请求（AD-09）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
